<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер к собеседованию</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 960px; margin: 0 auto; padding: 20px; background: #f4f6f8; color: #1f2937; }
    .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    h1, h2, h3 { margin-top: 0; }
    
    .menu-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
    @media (max-width: 768px) {
      .menu-layout { grid-template-columns: 1fr; }
    }

    button { display: block; width: 100%; text-align: left; padding: 12px 16px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-size: 16px; cursor: pointer; transition: 0.15s; }
    button:hover:not(:disabled) { background: #f3f4f6; border-color: #9ca3af; }
    button.correct { background: #dcfce7; border-color: #22c55e; color: #14532d; font-weight: 600; }
    button.wrong { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
    .btn-primary { background: #2563eb; color: #fff; border: none; text-align: center; font-weight: 600; }
    .btn-primary:hover { background: #1d4ed8; }
    .explanation { margin-top: 16px; padding: 14px; background: #eff6ff; border-left: 4px solid #3b82f6; border-radius: 6px; }
    .hidden { display: none !important; }
    .meta { color: #6b7280; font-size: 14px; margin-bottom: 12px; }

    /* История и синхронизация */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .history-header h2 { margin: 0; }
    .sync-toggle { width: auto; padding: 4px 10px; margin: 0; font-size: 13px; color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
    .sync-box { background: #f9fafb; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 16px; font-size: 13px; }
    .sync-box input { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .sync-status { font-size: 12px; color: #6b7280; margin-bottom: 10px; }

    .history-item { padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .history-item:last-child { border-bottom: none; padding-bottom: 0; }
    .history-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .history-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #6b7280; }
    .badge { padding: 2px 8px; border-radius: 12px; font-weight: 600; font-size: 12px; }
    .badge-good { background: #dcfce7; color: #166534; }
    .badge-mid { background: #fef9c3; color: #854d0e; }
    .badge-bad { background: #fee2e2; color: #991b1b; }
    .btn-clear { font-size: 13px; padding: 6px 10px; text-align: center; color: #6b7280; margin-top: 12px; }
  </style>
</head>
<body>

  <div id="menu-screen" class="menu-layout">
    <div class="card">
      <h1>Подготовка к собеседованию</h1>
      <div id="categories-list">Загрузка тем...</div>
    </div>

    <div class="card">
      <div class="history-header">
        <h2>Недавние тесты</h2>
        <button id="toggle-sync-btn" class="sync-toggle">⚙️ Синхронизация</button>
      </div>

      <div id="sync-status" class="sync-status">Локальный режим</div>

      <div id="sync-settings" class="sync-box hidden">
        <label>GitHub Gist ID:</label>
        <input type="text" id="gist-id-input" placeholder="Например: a1b2c3d4e5f6...">
        <label>GitHub Token (право gist):</label>
        <input type="password" id="gist-token-input" placeholder="ghp_...">
        <button id="save-sync-btn" class="btn-primary" style="padding: 8px; font-size: 14px;">Сохранить и синхронизировать</button>
      </div>

      <div id="history-list" class="meta">Пока нет пройденных тестов</div>
      <button id="clear-history-btn" class="btn-clear hidden">Очистить историю</button>
    </div>
  </div>

  <div id="quiz-screen" class="card hidden" style="max-width: 700px; margin: 0 auto;">
    <div class="meta" id="progress-text"></div>
    <h2 id="question-text"></h2>
    <div id="options-list"></div>
    <div id="explanation-box" class="explanation hidden"></div>
    <button id="next-btn" class="btn-primary hidden" style="margin-top: 16px;">Дальше →</button>
    <button id="back-btn" style="margin-top: 8px; text-align: center;">В меню</button>
  </div>

  <div id="result-screen" class="card hidden" style="max-width: 700px; margin: 0 auto;">
    <h2>Тест завершен!</h2>
    <p id="score-text" style="font-size: 18px;"></p>
    <button id="restart-btn" class="btn-primary">В главное меню</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
